      <line x1="10" y1="17" x2="22" y2="17" stroke="#61589B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="24" x2="20" y2="24" stroke="#61589B" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="31" x2="23" y2="31" stroke="#61589B" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="38" x2="18" y2="38" stroke="#61589B" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
